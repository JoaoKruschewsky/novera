name: "PR → main · verificação completa"
run-name: "PR #${{ github.event.pull_request.number }} → main · ${{ github.head_ref }}"

# Roda em todo pull request para a main (ao abrir e a cada novo push na branch do PR).
# Bateria completa, com a matriz e2e. É o sinal verde para o merge.
# PR aberto pelo auto-PR (robô): a primeira execução fica aguardando aprovação no PR
# ("Approve and run"); os pushes seguintes da pessoa rodam sozinhos.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacoes:
    name: PR → main
    uses: ./.github/workflows/_verificacoes.yml
    with:
      e2e: true
