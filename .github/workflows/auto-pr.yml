name: "FEAT · abrir PR para a main"
run-name: "FEAT · abrir PR · ${{ github.ref_name }}"

# Abre automaticamente um PR para a main ao publicar uma branch de trabalho.
# Nunca faz merge: o merge é manual, depois do "PR → main" verde.
# Requer: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: ["feature/**", "fix/**", "chore/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  abrir-pr:
    name: FEAT / abrir PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Abrir PR para a main se ainda não existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existente=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$existente" != "0" ]; then
            echo "Já existe PR aberto para $BRANCH; nada a fazer."
            exit 0
          fi
          titulo=$(git log -1 --pretty=%s)
          gh pr create --base main --head "$BRANCH" --title "$titulo" --body-file .github/pull_request_template.md
          # A primeira execução do "PR → main" em um PR aberto pelo robô fica aguardando
          # aprovação (botão "Approve and run" no PR). Os pushes seguintes rodam sozinhos.
